# Build Vite bundle and publish to GitHub Pages (fixes white screen from raw `/src/*.tsx`).
# Repo → Settings → Pages → Source: GitHub Actions
#
# Duplicate default artifact name "github-pages" in one run can break deploy-pages; use a
# unique artifact name per run (see github.com/actions/upload-pages-artifact/issues/97).
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; drop stale in-flight workflows on new pushes.
concurrency:
  group: "pages-${{ github.repository }}"
  cancel-in-progress: true

env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Client-side routes: GH Pages serves 404.html for unknown paths on refresh/deep-link
      - name: SPA fallback for Pages
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
